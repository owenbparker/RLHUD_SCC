<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rocket League HUD</title>
<!--
  The HUD: a 1920x1080 browser source, after the RLCS 2026 broadcast HUD.
    - the scorebug (top middle): logos, scores, clock and the series; it
      opens out to the team names and the event around goals, replays and
      kickoffs;
    - each team's players with their boost (top left / top right), the
      spectated one picked out, and what they just did (shot, save, goal,
      assist, demo) by their name;
    - sponsors under the blue team;
    - the spectated player's name and stats (bottom left) and boost (bottom
      right).
  Fed by /api/stream (the match from Rocket League's Stats API).
-->
<style>
  @font-face { font-family: "RL"; src: url("fonts/Saira-ExtraBoldItalic.ttf"); font-weight: 800; font-style: italic; }
  @font-face { font-family: "RL"; src: url("fonts/Saira-SemiBoldItalic.ttf"); font-weight: 600; font-style: italic; }
  :root { --blue: #1d5fd6; --orange: #d1892b; --panel: rgba(18, 19, 23, .94); --panel-solid: #121317;
          --track: #2b2d33; --ease: cubic-bezier(.2, .8, .2, 1); }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { font: italic 800 22px "RL", sans-serif; color: #fff; text-transform: uppercase; }
  html.fit body { transform-origin: 0 0; }
  .abs { position: absolute; }
  .hide { opacity: 0 !important; pointer-events: none; }
  .fade { transition: opacity .35s ease; }

  /* --- the scorebug --------------------------------------------------------- */
  #bug { position: absolute; left: 0; top: 0; width: 1920px; height: 150px; }
  #bug .head { position: absolute; top: 16px; height: 28px; left: 740px; width: 440px; background: var(--panel-solid);
               transition: left .5s var(--ease), width .5s var(--ease); overflow: hidden; }
  #bug.open .head { left: 493px; width: 934px; }
  #bug .head .title { position: absolute; inset: 0 40px; display: flex; align-items: center; justify-content: center;
                      font: italic 800 17px "RL"; letter-spacing: .13em; color: #e8e8ea; white-space: nowrap; }
  #bug .head .title span { transition: opacity .3s; }
  #bug .head .hex { position: absolute; top: 3px; width: 22px; height: 22px; }
  #bug .head .hex.l { left: 9px; } #bug .head .hex.r { right: 9px; }
  .plate { position: absolute; top: 44px; height: 78px; width: 247px; display: flex; align-items: center; justify-content: center;
           font: italic 800 31px "RL"; letter-spacing: .02em; text-shadow: 0 2px 6px rgba(0,0,0,.35);
           transition: transform .5s var(--ease), opacity .3s; white-space: nowrap; overflow: hidden; }
  .plate span { display: inline-block; }
  .plate.l { left: 493px; background: linear-gradient(90deg, color-mix(in srgb, var(--blue), #fff 18%), var(--blue)); transform-origin: right; }
  .plate.r { left: 1180px; background: linear-gradient(90deg, var(--orange), color-mix(in srgb, var(--orange), #fff 30%) 60%, var(--orange));
             transform-origin: left; }
  #bug:not(.open) .plate { transform: scaleX(0); opacity: 0; }
  .logo-box { position: absolute; top: 44px; width: 75px; height: 98px; background: var(--panel-solid); }
  .logo-box.l { left: 740px; } .logo-box.r { left: 1105px; }
  .logo-box img { position: absolute; left: 7px; top: 8px; width: 61px; height: 61px; object-fit: contain; }
  .logo-box .code { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; font: italic 800 16px "RL"; letter-spacing: .03em; }
  .logo-box .noimg { position: absolute; left: 0; right: 0; top: 18px; text-align: center; font: italic 800 24px "RL"; }
  .score { position: absolute; top: 44px; width: 70px; height: 78px; display: grid; place-items: center; font: italic 800 66px "RL"; }
  .score.l { left: 815px; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--blue), #fff 22%), var(--blue) 75%); }
  .score.r { left: 1035px; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--orange), #fff 22%), var(--orange) 75%); }
  .clock { position: absolute; left: 885px; top: 44px; width: 150px; height: 78px; background: #f3f3f4; color: #0c0c0e;
           display: grid; place-items: center; font: italic 800 56px "RL"; letter-spacing: .01em; }
  .clock.ot { color: #0c0c0e; }
  .series { position: absolute; left: 815px; top: 122px; width: 290px; height: 20px; background: var(--panel-solid);
            display: flex; gap: 7px; padding: 5px 6px; box-sizing: border-box; }
  .series i { flex: 1; background: #4a4c52; }
  .series i.l { background: var(--blue); } .series i.r { background: var(--orange); }
  .series i.now { background: #6a6d74; box-shadow: inset 0 0 0 1.5px #b9bcc3; }

  /* --- the players --------------------------------------------------------- */
  .team { position: absolute; top: 12px; width: 340px; }
  .team.l { left: 0; } .team.r { right: 0; }
  .row { position: relative; height: 40px; margin-bottom: 8px; }
  .row .bar { position: absolute; top: 0; height: 40px; width: 300px; background: var(--panel);
              transition: width .3s var(--ease), background .3s; }
  .team.l .row .bar { left: 0; } .team.r .row .bar { right: 0; }
  .row .name { position: absolute; top: 3px; font: italic 800 21px "RL"; letter-spacing: .02em; white-space: nowrap; }
  .team.l .row .name { left: 9px; } .team.r .row .name { right: 15px; }
  .row .num { position: absolute; top: 2px; font: italic 800 24px "RL"; transition: opacity .2s; }
  .team.l .row .num { left: 248px; width: 40px; text-align: right; }
  .team.r .row .num { right: 252px; width: 40px; text-align: left; }
  .row .track { position: absolute; bottom: 6px; height: 4px; width: 276px; background: rgba(255,255,255,.09); }
  .team.l .row .track { left: 9px; } .team.r .row .track { right: 15px; }
  .row .fill { position: absolute; top: 0; bottom: 0; width: 0; transition: width .15s linear; }
  .team.l .fill { left: 0; background: color-mix(in srgb, var(--blue), #fff 12%); }
  .team.r .fill { right: 0; background: color-mix(in srgb, var(--orange), #fff 18%); }
  /* The spectated player: picked out in the team colour. */
  .team.l .row.target .bar { width: 315px; background: linear-gradient(90deg, var(--panel) 25%, color-mix(in srgb, var(--blue), #fff 10%)); }
  .team.r .row.target .bar { width: 315px; background: linear-gradient(270deg, var(--panel) 25%, color-mix(in srgb, var(--orange), #fff 25%)); }
  .row.target .num { opacity: 0; }
  .row.dead .name, .row.dead .num { opacity: .4; }
  /* What they just did: icons by the name, on a strip in the team colour. */
  .row .feed { position: absolute; top: 0; height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 8px;
               opacity: 0; transition: opacity .25s; }
  .team.l .row .feed { left: 300px; flex-direction: row; background: color-mix(in srgb, var(--blue), #fff 25%); }
  .team.r .row .feed { right: 300px; flex-direction: row-reverse; background: color-mix(in srgb, var(--orange), #fff 30%); }
  /* ...and the row lights up from the icons' side into the name. */
  .team.l .row.busy:not(.target) .bar { background: linear-gradient(270deg, color-mix(in srgb, var(--blue), #fff 25%), var(--panel) 60%); }
  .team.r .row.busy:not(.target) .bar { background: linear-gradient(90deg, color-mix(in srgb, var(--orange), #fff 30%), var(--panel) 60%); }
  .team.l .row.target .feed { left: 315px; } .team.r .row.target .feed { right: 315px; }
  .row .feed.on { opacity: 1; }
  .row .feed svg { width: 36px; height: 36px; filter: drop-shadow(0 0 4px rgba(255, 210, 120, .9)); }

  /* --- sponsors (under the blue team) -------------------------------------- */
  #sponsor { position: absolute; left: 0; top: 158px; width: 300px; height: 78px;
             background: linear-gradient(90deg, #08142e, #0d2552); border-right: 10px solid color-mix(in srgb, var(--blue), #fff 15%); box-sizing: border-box; }
  #sponsor img { position: absolute; inset: 10px 20px; width: calc(100% - 40px); height: calc(100% - 20px); object-fit: contain;
                 transition: opacity .4s; }

  /* --- the spectated player ------------------------------------------------- */
  #target { position: absolute; left: 0; top: 1036px; width: 960px; height: 44px; }
  #target .plate2 { position: absolute; left: 0; top: 0; width: 300px; height: 44px; overflow: hidden; }
  #target .plate2 .bg { position: absolute; inset: 0; }
  #target.t0 .plate2 .bg { background: linear-gradient(90deg, color-mix(in srgb, var(--blue), #fff 30%), var(--blue)); }
  #target.t1 .plate2 .bg { background: linear-gradient(90deg, color-mix(in srgb, var(--orange), #fff 35%), var(--orange)); }
  #target .plate2 .who { position: absolute; right: 16px; top: 6px; font: italic 800 23px "RL"; letter-spacing: .02em; }
  #target .plate2 .boostline { position: absolute; left: 20px; bottom: 4px; height: 3px; background: #fff; width: 0; transition: width .15s linear; }
  #target .stats { position: absolute; left: 300px; top: 0; width: 660px; height: 44px; background: var(--panel-solid);
                   display: flex; align-items: center; justify-content: space-around; padding: 0 14px; box-sizing: border-box; }
  #target .stats div { font: italic 800 25px "RL"; white-space: nowrap; }
  #target .stats small { font: italic 600 17px "RL"; letter-spacing: .02em; margin-left: 6px; color: #eceef2; }
  #target .stats::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--team-c, var(--orange)); }

  /* The boost dial (bottom right). */
  #boost { position: absolute; left: 1628px; top: 842px; width: 216px; height: 216px; }
  #boost svg { width: 216px; height: 216px; overflow: visible; }
  #boost .val { position: absolute; inset: 0; display: grid; place-items: center; font: italic 800 74px "RL"; padding-right: 4px; }
</style>
</head>
<body>
<div id="bug">
  <div class="head"><svg class="hex l" viewBox="0 0 22 22"></svg><div class="title"><span></span></div><svg class="hex r" viewBox="0 0 22 22"></svg></div>
  <div class="plate l"><span></span></div><div class="plate r"><span></span></div>
  <div class="logo-box l"><img alt=""><div class="noimg"></div><div class="code"></div></div>
  <div class="score l">0</div><div class="clock">5:00</div><div class="score r">0</div>
  <div class="logo-box r"><img alt=""><div class="noimg"></div><div class="code"></div></div>
  <div class="series"></div>
</div>
<div class="team l fade" id="team0"></div>
<div class="team r fade" id="team1"></div>
<div id="sponsor" class="fade hide"><img alt=""></div>
<div id="target" class="fade hide"><div class="plate2"><div class="bg"></div><div class="who"></div><div class="boostline"></div></div>
  <div class="stats"></div></div>
<div id="boost" class="fade hide"><svg viewBox="-108 -108 216 216"></svg><div class="val">0</div></div>
<script>
(function () {
  "use strict";
  const $ = s => document.querySelector(s);
  if (new URLSearchParams(location.search).has("fit")) {   // the HUD-on-game window: fill it
    document.documentElement.classList.add("fit");
    const fit = () => { document.body.style.transform = `scale(${innerWidth / 1920}, ${innerHeight / 1080})`; };
    addEventListener("resize", fit); fit();
  }

  // Icons (white, glowing): goal, shot, save, assist, demo.
  const ICONS = {
    goal: '<svg viewBox="0 0 40 40"><path fill="#fff" d="M20 1l3 7 7-4-2 8 8 1-6 5 6 6-8 1 2 8-7-4-3 7-3-7-7 4 2-8-8-1 6-6-6-5 8-1-2-8 7 4z"/><circle cx="20" cy="20" r="8.5" fill="#e8a33c" stroke="#fff" stroke-width="2"/><path d="M20 15l4 3-1.5 4.5h-5L16 18z" fill="#fff"/></svg>',
    shot: '<svg viewBox="0 0 40 40"><path fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" d="M22 9c6-6 12-6 15-7M25 13c5-3 10-3 13-3M27 18c4-1 8 0 10 1"/><circle cx="16" cy="24" r="11" fill="#e8a33c" stroke="#fff" stroke-width="2.4"/><path d="M16 18l5 4-2 6h-6l-2-6z" fill="#fff"/></svg>',
    save: '<svg viewBox="0 0 40 40"><path fill="#fff" d="M9 22V10a2 2 0 014 0v9h1V6a2 2 0 014 0v12h1V5a2 2 0 014 0v13h1V8a2 2 0 014 0v16c0 7-5 12-11 12-4 0-7-2-9-5l-5-8a2 2 0 013-2z"/></svg>',
    assist: '<svg viewBox="0 0 40 40"><path fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M6 28l10-10 6 6 12-12M26 12h8v8"/></svg>',
    demo: '<svg viewBox="0 0 40 40"><path fill="#fff" d="M20 2l4 9 9-5-3 10 9 3-9 4 5 9-10-3-2 10-4-9-7 7 1-10-10-1 8-6-6-8 10 1z"/><circle cx="20" cy="20" r="6" fill="#e8a33c"/></svg>',
  };
  const HEX = c => `<path d="M11 1.5l8.3 4.75v9.5L11 20.5l-8.3-4.75v-9.5z" fill="none" stroke="${c}" stroke-width="1.8"/>` +
    `<rect x="8" y="7" width="2" height="8" fill="${c}"/><rect x="12" y="7" width="2" height="8" fill="${c}"/>`;

  let cfg = null, game = null, sponsorIndex = 0, sponsorTimer = null;
  const nameOf = p => (cfg.names && cfg.names[p.name]) || p.name;
  const clock = (s, ot) => (ot ? "+" : "") + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  function fitText(el, max) {
    el.style.fontSize = "";
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > max && size > 10) { size -= 1; el.style.fontSize = size + "px"; }
  }

  function renderBug() {
    const L = cfg.left, R = cfg.right, g = game;
    document.documentElement.style.setProperty("--blue", L.color || "#1d5fd6");
    document.documentElement.style.setProperty("--orange", R.color || "#d1892b");
    const open = cfg.scorebug === "expanded" || (cfg.scorebug !== "compact" && g.phase !== "live" && g.phase !== "none");
    $("#bug").classList.toggle("open", open);
    $("#bug .head .title span").textContent = open && cfg.event ? `${cfg.event} | ${cfg.stage}` : cfg.stage;
    for (const [side, t, i] of [["l", L, 0], ["r", R, 1]]) {
      const box = $(`.logo-box.${side}`), img = box.querySelector("img");
      if (t.logo) { if (img.getAttribute("src") !== t.logo) img.src = t.logo; img.hidden = false; box.querySelector(".noimg").textContent = ""; }
      else { img.hidden = true; box.querySelector(".noimg").textContent = t.tricode || ""; }
      box.querySelector(".code").textContent = open ? (t.region || t.tricode || "") : (t.tricode || "");
      const plate = $(`.plate.${side} span`);
      if (plate.textContent !== (t.name || "")) { plate.textContent = t.name || ""; fitText(plate, 225); }
      $(`.score.${side}`).textContent = (g.teams[i] || {}).score || 0;
    }
    $(".clock").textContent = clock(g.clock || 0, g.overtime);
    // The series: blue's wins from the left, orange's from the right, this game lit.
    const n = Math.max(1, Number(cfg.best_of) || 1), lw = Number(L.wins) || 0, rw = Number(R.wins) || 0;
    let pips = "";
    for (let k = 0; k < n; k++) {
      const cls = k < lw ? "l" : k >= n - rw ? "r" : k === lw ? "now" : "";
      pips += `<i class="${cls}"></i>`;
    }
    if ($(".series").innerHTML !== pips) $(".series").innerHTML = pips;
  }

  function renderTeams() {
    const show = cfg.show || {}, now = game.events || [];
    for (const t of [0, 1]) {
      const box = $("#team" + t), players = game.players.filter(p => p.team === t);
      box.classList.toggle("hide", show.players === false || !players.length);
      while (box.children.length < players.length) {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = '<div class="feed"></div><div class="bar"></div><div class="name"></div><div class="num"></div><div class="track"><div class="fill"></div></div>';
        box.appendChild(row);
      }
      while (box.children.length > players.length) box.lastChild.remove();
      players.forEach((p, i) => {
        const row = box.children[i];
        const isTarget = !!game.target && game.target.name === p.name && game.target.team === p.team;
        row.classList.toggle("target", isTarget);
        row.classList.toggle("dead", p.demolished);
        const name = row.querySelector(".name");
        if (name.textContent !== nameOf(p)) { name.textContent = nameOf(p); fitText(name, 230); }
        const boost = p.boost == null ? null : Math.round(p.boost);
        row.querySelector(".num").textContent = boost == null ? "" : boost;
        row.querySelector(".fill").style.width = (boost || 0) + "%";
        // What they've just done.
        const mine = show.events === false ? [] : now.filter(e => e.player.name === p.name && e.player.team === p.team).slice(-3);
        const feed = row.querySelector(".feed"), key = mine.map(e => e.id).join(",");
        if (feed.dataset.key !== key) { feed.dataset.key = key; if (mine.length) feed.innerHTML = mine.map(e => ICONS[e.icon] || "").join(""); }
        feed.classList.toggle("on", mine.length > 0);
        row.classList.toggle("busy", mine.length > 0);
      });
    }
  }

  function renderSponsor() {
    const list = (cfg.sponsors || []).filter(Boolean), on = (cfg.show || {}).sponsors !== false && list.length > 0;
    $("#sponsor").classList.toggle("hide", !on);
    if (!on) return;
    const img = $("#sponsor img"), src = list[sponsorIndex % list.length];
    if (img.getAttribute("src") !== src) { img.style.opacity = 0; setTimeout(() => { img.src = src; img.style.opacity = 1; }, 300); }
    clearTimeout(sponsorTimer);
    sponsorTimer = setTimeout(() => { sponsorIndex++; renderSponsor(); }, Math.max(2, Number(cfg.sponsor_seconds) || 8) * 1000);
  }

  function renderTarget() {
    const show = cfg.show || {}, t = game.target;
    const p = t && game.players.find(x => x.name === t.name && x.team === t.team);
    const on = !!p && game.phase !== "replay" && game.phase !== "podium";
    $("#target").classList.toggle("hide", !on || show.target === false);
    $("#boost").classList.toggle("hide", !on || show.boost === false || p.boost == null);
    if (!p) return;
    const team = p.team, colour = team ? "var(--orange)" : "var(--blue)";
    $("#target").className = $("#target").className.replace(/\bt[01]\b/g, "").trim() + " t" + team;
    $("#target").style.setProperty("--team-c", colour);
    const who = $("#target .who");
    if (who.textContent !== nameOf(p)) { who.textContent = nameOf(p); fitText(who, 260); }
    $("#target .boostline").style.width = (p.boost || 0) * 2.64 + "px";
    const stats = [["goals", p.goals], ["shots", p.shots], ["assists", p.assists], ["saves", p.saves], ["demos", p.demos]];
    const html = stats.map(([k, v]) => `<div>${v || 0}<small>${k}</small></div>`).join("");
    if ($("#target .stats").innerHTML !== html) $("#target .stats").innerHTML = html;
    // The dial: the ring fills clockwise from the bottom.
    const b = Math.max(0, Math.min(100, p.boost || 0)), r = 96, a = b / 100 * 2 * Math.PI;
    const x = -Math.sin(a) * r, y = Math.cos(a) * r, large = b > 50 ? 1 : 0;
    const arc = b >= 100 ? `<circle r="${r}" fill="none" stroke="${colour}" stroke-width="16"/>`
      : b > 0 ? `<path d="M0 ${r} A${r} ${r} 0 ${large} 1 ${x.toFixed(2)} ${y.toFixed(2)}" fill="none" stroke="${colour}" stroke-width="16"/>` : "";
    $("#boost svg").innerHTML = `<circle r="107" fill="#0b0b0d"/><circle r="${r}" fill="none" stroke="#2a2b30" stroke-width="16"/>${arc}` +
      `<circle r="80" fill="#070708" stroke="#1d1e22" stroke-width="2"/>` +
      `<path d="M0 -107v14M-107 0h14M107 0h-14" stroke="#fff" stroke-width="2.5"/>`;
    $("#boost .val").textContent = Math.round(b);
  }

  function render() {
    if (!cfg || !game) return;
    renderBug();
    renderTeams();
    renderTarget();
  }

  document.querySelector(".hex.l").innerHTML = HEX("#3d7cf0");
  document.querySelector(".hex.r").innerHTML = HEX("#d9a24c");
  let sponsorsKey = null;
  function connect() {
    const es = new EventSource("/api/stream");
    es.onmessage = ev => {
      const msg = JSON.parse(ev.data);
      cfg = msg.config; game = msg.game;
      const key = JSON.stringify([cfg.sponsors, cfg.show && cfg.show.sponsors, cfg.sponsor_seconds]);
      if (key !== sponsorsKey) { sponsorsKey = key; sponsorIndex = 0; renderSponsor(); }
      render();
      window.rlHud = msg;   // (for checking the overlay)
    };
  }
  connect();
})();
</script>
</body>
</html>
